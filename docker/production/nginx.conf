server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    client_max_body_size 32M;

    access_log /var/log/nginx/easyappointments.access.log;
    error_log /var/log/nginx/easyappointments.error.log;

    # Docker embedded DNS — resolve PHP upstream at request time (avoids
    # "host not found in upstream app" when nginx starts before DNS is ready).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 120s;
    }

    location ~* /\.(git|env|htaccess|htpasswd) {
        deny all;
    }

    location ~* ^/(storage|application|system|vendor|docker)/ {
        deny all;
    }
}
