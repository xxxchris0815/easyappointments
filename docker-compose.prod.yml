# Production stack for this Easy!Appointments fork.
#
# Setup:
#   1. cp .env.prod.example .env.prod
#   2. cp config.docker.example.php config.php
#   3. Edit both files (replace every <PLACEHOLDER>)
#   4. docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# Full guide: docs/docker-production.md

services:
  app:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
    image: easyappointments-fork:prod
    restart: unless-stopped
    volumes:
      - ea_code:/var/www/html
      - ./config.php:/var/www/html/config.php:ro
      - ea_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/index.php"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/production/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ea_code:/var/www/html:ro
      - ea_storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env.prod}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-easyappointments}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env.prod}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env.prod}
    volumes:
      - ea_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  reminders:
    image: easyappointments-fork:prod
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/ea-entrypoint"]
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          php /var/www/html/index.php console reminders || true
          sleep $${REMINDER_INTERVAL_SECONDS:-60}
        done
    volumes:
      - ea_code:/var/www/html
      - ./config.php:/var/www/html/config.php:ro
      - ea_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      REMINDER_INTERVAL_SECONDS: ${REMINDER_INTERVAL_SECONDS:-60}

volumes:
  ea_code:
  ea_mysql:
  ea_storage:
